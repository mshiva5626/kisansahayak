<!doctype html>
<html lang="en" class="light">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-512.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kissan Sahayak</title>
  <meta name="description" content="AI-Powered Agricultural Intelligence for Indian Farmers" />

  <!-- Preconnect to Google Tile Servers for instant satellite map loading -->
  <link rel="preconnect" href="https://mt0.google.com" crossorigin />
  <link rel="preconnect" href="https://mt1.google.com" crossorigin />
  <link rel="preconnect" href="https://mt2.google.com" crossorigin />
  <link rel="preconnect" href="https://mt3.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://mt0.google.com" />
  <link rel="dns-prefetch" href="https://mt1.google.com" />
  <link rel="dns-prefetch" href="https://unpkg.com" />

  <!-- Preload Leaflet assets so map initializes instantly -->
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" as="style" />
  <link rel="preload" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" as="script" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#059669" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Kissan Sahayak" />
  <link rel="apple-touch-icon" href="/icons/icon-512.svg" />
  <link rel="manifest" href="/manifest.json" />

  <!-- Google Fonts & Material Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
    rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
    rel="stylesheet" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
  <script>
    // Register Service Worker for PWA
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('SW registered:', reg.scope))
          .catch(err => console.log('SW registration failed:', err));
      });
    }
  </script>
</body>

</html>
